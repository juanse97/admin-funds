<h2 class="text-2xl font-semibold text-slate-800 mb-6">
    Historial de transacciones
</h2>

<app-loading text="Cargando transacciones..." *ngIf="isLoading"></app-loading>

<div *ngIf="!transactions.length && !isLoading" class="text-center text-slate-500 py-10">
    No hay transacciones registradas
</div>

<app-data-table *ngIf="transactions.length && !isLoading" [columns]="columns" [data]="transactions">
</app-data-table>
