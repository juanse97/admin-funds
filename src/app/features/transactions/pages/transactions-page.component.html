<h2 class="text-2xl font-semibold text-slate-800 mb-6">
    Historial de transacciones
</h2>

<ng-container *ngIf="viewModel$ | async as vm">
    <app-loading *ngIf="vm.loading"></app-loading>

    <div *ngIf="!vm.loading && !vm.transactions.length">
        No hay transacciones
    </div>

    <app-data-table *ngIf="!vm.loading && vm.transactions.length" [data]="vm.transactions" [columns]="columns">
    </app-data-table>
</ng-container>
