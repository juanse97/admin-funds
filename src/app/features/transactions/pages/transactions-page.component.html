<h2 class="text-2xl font-semibold text-slate-800 mb-6">
    Historial de transacciones
</h2>

<app-loading text="Cargando transacciones..." *ngIf="isLoading$ | async">
</app-loading>

<div *ngIf="!(transactions$ | async)?.length && !(isLoading$ | async)">
    No hay transacciones
</div>

<app-data-table *ngIf="!(isLoading$ | async) && (transactions$ | async)?.length" [columns]="columns"
    [data]="(transactions$ | async) ?? []">
</app-data-table>
