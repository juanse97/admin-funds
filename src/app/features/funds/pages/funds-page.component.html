<h2 class="text-2xl font-semibold text-slate-800">Fondos disponibles</h2>

<p class="mt-2 text-slate-500">
    Saldo disponible:
    <span class="font-semibold text-slate-900">
        {{ balance | currency:'COP':'symbol':'1.0-0' }}
    </span>
</p>

<app-loading text="Cargando fondos..." *ngIf="isLoading"></app-loading>

<div *ngIf="hasError" class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">

    <p class="text-sm text-red-700">
        {{ errorMessage }}
    </p>

    <button class="mt-3 px-4 py-2 bg-red-600 text-white rounded-lg text-sm" (click)="loadFunds()">
        Reintentar
    </button>

</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-4" *ngIf="!isLoading && !hasError">
    <app-fund-card *ngFor="let fund of funds" [fund]="fund" [balance]="balance" (subscribe)="subscribe($event)">
    </app-fund-card>
</div>

<div *ngIf="subscribedFunds.length" class="my-8">

    <h2 class="text-2xl font-semibold text-slate-800 mb-4">
        Mis fondos
    </h2>

    <ng-template #actionTemplate let-subscription>

        <button class="px-3 py-1.5 text-xs font-medium text-red-600
           bg-red-50 rounded-lg hover:bg-red-100 transition" (click)="cancel(subscription)">
            Cancelar
        </button>

    </ng-template>

    <app-data-table [columns]="columns" [data]="tableData()" [actionTemplate]="actionTemplate">
    </app-data-table>

</div>

<ng-template #notificationTemplate>

    <div class="flex gap-2 mt-4">
        <button class="flex-1 px-4 py-2 rounded-lg border text-sm font-medium transition" [ngClass]="notificationMethod === 'EMAIL'
      ? 'bg-slate-900 text-white border-slate-900'
      : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'" (click)="notificationMethod = 'EMAIL'">
            Email
        </button>

        <button class="flex-1 px-4 py-2 rounded-lg border text-sm font-medium transition" [ngClass]="notificationMethod === 'SMS'
      ? 'bg-slate-900 text-white border-slate-900'
      : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'" (click)="notificationMethod = 'SMS'">
            SMS
        </button>
    </div>

    <div class="flex justify-end pt-2">
        <button class="mt-3 bg-slate-900 text-white px-3 py-2 rounded" [disabled]="!notificationMethod"
            (click)="confirmSubscription()">
            Continuar
        </button>
    </div>

</ng-template>
<ng-template #unsubscribeTemplate>

    <div class="flex justify-end pt-2">
        <button class="mt-3 bg-red-600 text-white px-3 py-2 rounded" (click)="confirmUnsubscribe()">
            Confirmar cancelación
        </button>
    </div>

</ng-template>

<app-modal [isOpen]="showModal" [type]="typeMessage" [title]="titleMessage" [message]="message"
    [showContent]="modalMode !== 'error'" (close)="resetModal()">

    <ng-container *ngIf="modalMode === 'subscribe'">
        <ng-container *ngTemplateOutlet="notificationTemplate"></ng-container>
    </ng-container>

    <ng-container *ngIf="modalMode === 'unsubscribe'">
        <ng-container *ngTemplateOutlet="unsubscribeTemplate"></ng-container>

    </ng-container>

</app-modal>
