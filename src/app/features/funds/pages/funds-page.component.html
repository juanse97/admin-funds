<h2 class="text-2xl font-semibold text-slate-800">Fondos disponibles</h2>

<p class="mt-2 text-slate-500">
    Saldo disponible:
    <span class="font-semibold text-slate-900">
        {{ balance | currency:'COP':'symbol':'1.0-0' }}
    </span>
</p>

<app-loading text="Cargando fondos..." *ngIf="isLoading"></app-loading>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-4" *ngIf="!isLoading">
    <app-fund-card *ngFor="let fund of funds" [fund]="fund" [balance]="balance" (subscribe)="subscribe($event)">
    </app-fund-card>
</div>

<app-modal [isOpen]="showModal" [type]="typeMessage" [title]="titleMessage" [message]="message"
    [showContent]="showChildren" (close)="showModal = false">
    <div class="flex gap-2 mt-4">

        <button class="flex-1 px-4 py-2 rounded-lg border text-sm font-medium transition" [ngClass]="notificationMethod === 'EMAIL'
      ? 'bg-slate-900 text-white border-slate-900'
      : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'" (click)="notificationMethod = 'EMAIL'">
            Email
        </button>

        <button class="flex-1 px-4 py-2 rounded-lg border text-sm font-medium transition" [ngClass]="notificationMethod === 'SMS'
      ? 'bg-slate-900 text-white border-slate-900'
      : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-50'" (click)="notificationMethod = 'SMS'">
            SMS
        </button>

    </div>

    <div class="flex justify-end pt-2">
        <button class="mt-3 bg-slate-900 text-white px-3 py-2 rounded" [disabled]="!notificationMethod"
            (click)="confirmSubscription()">
            Continuar
        </button>
    </div>

</app-modal>
