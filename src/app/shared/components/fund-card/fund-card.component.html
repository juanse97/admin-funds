<div
    class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 hover:shadow-md transition flex flex-col justify-between">

    <h3 class="text-lg font-semibold text-slate-800 break-all">{{ fund.name }}</h3>

    <p class="mt-2 text-sm text-slate-500">
        Categoría:
        <span class="font-medium text-slate-700">
            {{ fund.category }}
        </span>
    </p>


    <p class="mt-3 text-sm text-slate-500">
        Monto mínimo:
        <span class="font-medium text-slate-700">
            {{ fund.minimumAmount | currency:'COP':'symbol':'1.0-0' }}
        </span>
    </p>

    <div class="flex gap-3 mt-6">

        <button class="flex-1 bg-slate-900 text-white text-sm font-medium
             py-2 rounded-lg hover:bg-slate-800 transition" (click)="subscribe.emit(fund)">
            Suscribirse
        </button>

    </div>

</div>
